<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="A request flowing from client through auth, validation, logic and database">
<style>
.t{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif}
.mono{font-family:ui-monospace, 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace}
@keyframes pulse{0%,100%{opacity:.35}12%{opacity:1}}
@keyframes glow{0%,100%{stroke-opacity:.25}12%{stroke-opacity:1}}
@keyframes dash{to{stroke-dashoffset:-24}}
.flow{stroke-dasharray:5 7;animation:dash 1.1s linear infinite}
</style>
<rect x="1" y="1" width="878" height="248" rx="12" fill="#1a1b26" stroke="#2f3549"/>
<text class="t" x="24" y="32" font-size="14" font-weight="600" fill="#c0caf5">Request lifecycle</text>
<text class="t" x="24" y="51" font-size="11.5" fill="#565f89">the path I can follow end to end — and where it breaks</text>
<line class="flow" x1="162.0" y1="112.0" x2="194.5" y2="112.0" stroke="#2f3549" stroke-width="2"/>
<line class="flow" x1="336.5" y1="112.0" x2="369.0" y2="112.0" stroke="#2f3549" stroke-width="2"/>
<line class="flow" x1="511.0" y1="112.0" x2="543.5" y2="112.0" stroke="#2f3549" stroke-width="2"/>
<line class="flow" x1="685.5" y1="112.0" x2="718.0" y2="112.0" stroke="#2f3549" stroke-width="2"/>
<rect x="20.0" y="74" width="142" height="76" rx="9" fill="#16161e" stroke="#7aa2f7" stroke-width="1.6" style="animation:glow 7.0s ease-in-out 0.00s infinite"/>
<text class="t" x="91.0" y="105" font-size="13.5" font-weight="600" fill="#7aa2f7" text-anchor="middle">Client</text>
<text class="mono" x="91.0" y="125" font-size="10.5" fill="#565f89" text-anchor="middle">HTTP + Bearer</text>
<rect x="194.5" y="74" width="142" height="76" rx="9" fill="#16161e" stroke="#bb9af7" stroke-width="1.6" style="animation:glow 7.0s ease-in-out 0.58s infinite"/>
<text class="t" x="265.5" y="105" font-size="13.5" font-weight="600" fill="#bb9af7" text-anchor="middle">Auth</text>
<text class="mono" x="265.5" y="125" font-size="10.5" fill="#565f89" text-anchor="middle">JWT · role check</text>
<rect x="369.0" y="74" width="142" height="76" rx="9" fill="#16161e" stroke="#7dcfff" stroke-width="1.6" style="animation:glow 7.0s ease-in-out 1.17s infinite"/>
<text class="t" x="440.0" y="105" font-size="13.5" font-weight="600" fill="#7dcfff" text-anchor="middle">Validation</text>
<text class="mono" x="440.0" y="125" font-size="10.5" fill="#565f89" text-anchor="middle">Pydantic schema</text>
<rect x="543.5" y="74" width="142" height="76" rx="9" fill="#16161e" stroke="#9ece6a" stroke-width="1.6" style="animation:glow 7.0s ease-in-out 1.75s infinite"/>
<text class="t" x="614.5" y="105" font-size="13.5" font-weight="600" fill="#9ece6a" text-anchor="middle">Logic</text>
<text class="mono" x="614.5" y="125" font-size="10.5" fill="#565f89" text-anchor="middle">business rules</text>
<rect x="718.0" y="74" width="142" height="76" rx="9" fill="#16161e" stroke="#ff9e64" stroke-width="1.6" style="animation:glow 7.0s ease-in-out 2.33s infinite"/>
<text class="t" x="789.0" y="105" font-size="13.5" font-weight="600" fill="#ff9e64" text-anchor="middle">Database</text>
<text class="mono" x="789.0" y="125" font-size="10.5" fill="#565f89" text-anchor="middle">transaction</text>
<path id="rail" d="M 91.0 112.0 L 789.0 112.0" fill="none"/>
<circle r="6" fill="#e0af68"><animateMotion dur="7.0s" repeatCount="indefinite" keyPoints="0;1;1;0;0" keyTimes="0;0.42;0.5;0.92;1" calcMode="linear"><mpath href="#rail"/></animateMotion></circle>
<circle r="13" fill="#e0af68" opacity=".16"><animateMotion dur="7.0s" repeatCount="indefinite" keyPoints="0;1;1;0;0" keyTimes="0;0.42;0.5;0.92;1" calcMode="linear"><mpath href="#rail"/></animateMotion></circle>
<text class="mono" x="265.5" y="180" font-size="11.5" fill="#f7768e" text-anchor="middle" opacity=".85">401 / 403</text>
<text class="mono" x="440.0" y="180" font-size="11.5" fill="#f7768e" text-anchor="middle" opacity=".85">422</text>
<text class="mono" x="789.0" y="180" font-size="11.5" fill="#9ece6a" text-anchor="middle" opacity=".85">200 OK</text>
<text class="t" x="440" y="234" font-size="10.5" fill="#565f89" text-anchor="middle">rejected early, or answered — never a crash</text>
</svg>