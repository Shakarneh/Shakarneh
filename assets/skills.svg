<rect x="250" y="255" width="324" height="14" rx="7" fill="#bb9af7" style="animation:grow 1.1s cubic-bezier(.2,.8,.2,1) 0.64s backwards"/>
<text class="mono pct" x="824" y="267" font-size="11.5" fill="#565f89" style="animation-delay:1.44s">58</text>
