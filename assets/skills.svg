<rect x="250" y="175" width="560" height="14" rx="7" fill="#16161e"/>
<rect x="250" y="175" width="459" height="14" rx="7" fill="#ff9e64" style="animation:grow 1.1s cubic-bezier(.2,.8,.2,1) 0.32s backwards"/>
<text class="mono pct" x="824" y="187" font-size="11.5" fill="#565f89" style="animation-delay:1.12s">82</text>
