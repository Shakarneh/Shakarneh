<svg xmlns="http://www.w3.org/2000/svg" width="880" height="358" viewBox="0 0 880 358" role="img" aria-label="Skill focus chart">
<style>
.t{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif}
.mono{font-family:ui-monospace, 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace}
@keyframes grow{from{width:0}}
@keyframes fade{to{opacity:1}}
.pct{opacity:0;animation:fade .4s ease forwards}
</style>
<rect x="1" y="1" width="878" height="356" rx="12" fill="#1a1b26" stroke="#2f3549"/>
<text class="t" x="24" y="36" font-size="14" font-weight="600" fill="#c0caf5">Where the work actually goes</text>
<text class="t" x="24" y="56" font-size="11.5" fill="#565f89">GitHub measures bytes, so it thinks I write CSS. This is the real split.</text>
<line x1="24" y1="70" x2="856" y2="70" stroke="#2f3549"/>
<text class="t" x="24" y="107" font-size="12.5" fill="#c0caf5">Python</text>
<rect x="250" y="95" width="560" height="14" rx="7" fill="#16161e"/>
<rect x="250" y="95" width="515" height="14" rx="7" fill="#7aa2f7" style="animation:grow 1.1s cubic-bezier(.2,.8,.2,1) 0.00s backwards"/>
<text class="mono pct" x="824" y="107" font-size="11.5" fill="#565f89" style="animation-delay:0.80s">92</text>
<text class="t" x="24" y="147" font-size="12.5" fill="#c0caf5">FastAPI · REST APIs</text>
<rect x="250" y="135" width="560" height="14" rx="7" fill="#16161e"/>
