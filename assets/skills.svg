<rect x="250" y="215" width="560" height="14" rx="7" fill="#16161e"/>
<rect x="250" y="215" width="420" height="14" rx="7" fill="#e0af68" style="animation:grow 1.1s cubic-bezier(.2,.8,.2,1) 0.48s backwards"/>
